site_name: Deep RL Course
site_url: https://DeepRL2026.github.io
theme:
  name: material
  custom_dir: overrides
  font:
    text: Ubuntu
    code: Red Hat Mono
  logo: assets/logo.png
  favicon: assets/favicon/favicon.ico
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: black
      accent: red

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
      primary: black
      accent: red
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.integrate
    # - navigation.indexes

plugins:
  - search
  # - blog:
  #     blog_toc: true
  #     post_readtime_words_per_minute: 250
  #     pagination_per_page: 5
  #     archive: true
  #     archive_name: Archive
  #     archive_date_format: MMMM yyyy
  #     archive_url_date_format: yyyy/MM
  #     archive_pagination_per_page: 10
  #     archive_toc: false
  #     categories_pagination_per_page: 10
  #     categories_toc: false
  # - tags:
  #     tags_file: blog/tags.md
  - social
  # - offline

extra:
  generator: false
  analytics:
    provider: google
    property: G-Q1YT8K39WE
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
  disable_toc_integrate_paths:
    - course_notes
    - prerequisites


copyright: Made with ❤️ in Robust and Interpretable Machine Learning Lab

nav:
  - Home:
    - index.md
    
  - Lectures:
    - lectures/lecture1.md
    - lectures/lecture2.md
    - lectures/lecture3.md
    - lectures/lecture4.md
    - lectures/lecture5.md
    - lectures/lecture6.md
    - lectures/lecture7.md
    - lectures/lecture8.md
    - lectures/lecture9.md
    - lectures/lecture10.md
    - lectures/lecture11.md
    - lectures/lecture12.md
    - lectures/lecture13.md
    - lectures/lecture14.md
    - lectures/lecture15.md
    - lectures/lecture16.md
    - lectures/lecture17.md
    - lectures/lecture18.md
    - lectures/lecture19.md

  - TA Sessions:
    - TA_Sessions/index.md

  - Homeworks:
    - homeworks/index.md

  - Projects:
    - Projects/index.md

  - Exams:
    - exams/index.md

  - Resources:
    - resources/index.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/vazirmatn.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - admonition
  - pymdownx.blocks.caption
  - tables
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - abbr
  - extra
  - admonition

  - pymdownx.details




